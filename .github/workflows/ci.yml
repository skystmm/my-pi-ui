name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm ci --prefix shell-service
      - run: npm install --global @earendil-works/pi-coding-agent@1.0.4
      - run: npm run check
      - run: npm run build
      - run: npm run test:pi-compat
